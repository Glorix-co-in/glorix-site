<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select Slot - GLORIX</title>
    <meta
      name="description"
      content="Select your preferred date and time slot for GLORIX events. Book tickets for upcoming shows and cultural experiences."
    />
    <meta
      name="keywords"
      content="GLORIX booking, event tickets, select slot, date time, book tickets"
    />
    <meta name="author" content="GLORIX" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="favicon-16x16.png" sizes="16x16" type="image/png" />

    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="select-slot.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Open+Sans:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="select-slot-header">
      <button class="back-btn" id="backBtn" aria-label="Go back">
        <i class="fas fa-chevron-left"></i>
      </button>
      <h1 class="header-title" id="headerTitle">EVENT NAME</h1>
    </header>

    <main class="select-slot-main">
      <div class="stepper">
        <div class="step active">
          <span class="step-num">1</span>
          <span class="step-label">Date & Time</span>
        </div>
        <i class="fas fa-chevron-right step-sep"></i>
        <div class="step">
          <span class="step-num">2</span>
          <span class="step-label">Payment</span>
        </div>
        <i class="fas fa-chevron-right step-sep"></i>
        <div class="step">
          <span class="step-num">3</span>
          <span class="step-label">Ticket</span>
        </div>
      </div>
      <div class="event-mini-info">
        <img src="" alt="" id="eventThumb" class="event-thumb" />
        <div class="event-text">
          <h2 id="eventTitle"></h2>
          <p id="eventVenue"></p>
        </div>
      </div>

      <div class="legend-container">
        <div class="legend-item">
          <span class="dot available"></span> Available
        </div>
        <div class="legend-item">
          <span class="dot filling-fast"></span> Filling Fast
        </div>
        <div class="legend-item">
          <span class="dot sold-out"></span> Sold out
        </div>
      </div>

      <div class="selection-card">
        <div class="selection-container">
          <section
            class="selection-section"
            id="dateSection"
            style="display: none"
          >
            <h3 class="section-title">Select Date</h3>
            <div class="slots-grid" id="dateSlots">
              <!-- Dates will be loaded here -->
            </div>
          </section>

          <section
            class="selection-section"
            id="timeSection"
            style="display: none"
          >
            <h3 class="section-title">Select Time</h3>
            <div class="slots-grid" id="timeSlots">
              <!-- Times will be loaded here -->
            </div>
          </section>
        </div>
      </div>

      <div class="sticky-bottom-bar">
        <button class="confirm-btn" id="confirmBtn" disabled>
          Continue to Booking
        </button>
      </div>
    </main>

    <script src="select-slot.js"></script>
  </body>
</html>
