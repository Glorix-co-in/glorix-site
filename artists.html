<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artists | GLORIX</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="index.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Open+Sans:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      .artists-page-header {
        padding-top: 0px;
        padding-bottom: 40px;
        text-align: center;
      }
      .artists-grid {
        padding-bottom: 100px;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <header class="navbar">
      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="logo">
        <a href="index.html">
          <img
            src="assets/cropped_logo.png"
            alt="GLORIX Logo"
            height="100%"
            loading="lazy"
          />
        </a>
        <p>The X Factor In Everything !</p>
      </div>

      <nav class="nav-center" id="navMenu">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#gallery">Gallery</a></li>
          <li><a href="bookings.html">Bookings</a></li>
          <li><a href="artists.html" class="active">Artists</a></li>
          <li><a href="team.html">Teams</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </nav>

      <a href="bookings.html" class="call-btn">Book Now</a>
    </header>

    <!-- Music Player -->
    <div class="music-player">
      <button id="musicBtn">▶</button>
      <audio id="bgMusic" loop>
        <source src="assets/glorix music.mp3" type="audio/mpeg" />
      </audio>
    </div>

    <main class="main-content">
      <section class="artists-page-header">
        <h2 class="section-title"><span>OUR</span> ARTISTS</h2>
        <p style="color: #888; max-width: 600px; margin: 0 auto">
          Discover the talented artists who bring the GLORIX vision to life.
        </p>
      </section>

      <section id="artists" class="artists-section" style="padding-top: 0">
        <div class="artists-grid" id="artistsGrid">
          <!-- Artists will be loaded dynamically here -->
        </div>
      </section>
    </main>

    <template id="artistTemplate">
      <a href="" class="artist-card" target="_blank" rel="noopener noreferrer">
        <img src="" alt="" loading="lazy" />
        <div class="artist-info">
          <h3></h3>
        </div>
      </a>
    </template>

    <!-- Footer -->
    <footer>
      <div class="social-links">
        <a
          href="https://www.linkedin.com/company/glorix-events/"
          target="_blank"
          ><i class="fab fa-linkedin"></i
        ></a>
        <a href="https://www.instagram.com/_glorix._" target="_blank"
          ><i class="fab fa-instagram"></i
        ></a>
        <a href="https://x.com/Glorix_events" target="_blank"
          ><i class="fab fa-x-twitter"></i
        ></a>
        <a href="https://www.youtube.com/@GLORIX_events" target="_blank"
          ><i class="fab fa-youtube"></i
        ></a>
      </div>
      <p class="copyright">Copyright © 2026 GLORIX - All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/Flip.min.js"></script>
    <script src="script.js"></script>
    <script src="main.js"></script>
  </body>
</html>
