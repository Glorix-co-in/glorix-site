    />

  <body>
    <!-- Navbar -->
    <header class="navbar">
      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="logo">
        <a href="index.html">
          <img
            src="assets/cropped_logo.png"
            alt="GLORIX Logo"
            height="100%"
            loading="eager"
            fetchpriority="high"
          />
        </a>
        <p>&nbsp;The X Factor In Everything !</p>
      </div>

      <nav class="nav-center" id="navMenu">
        <ul>
          <li><a href="index.html#home">Home</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="bookings.html">Bookings</a></li>
          <li><a href="artists.html">Artists</a></li>
          <li><a href="team.html">Team</a></li>
          <li><a href="index.html#email-subscription">Contact</a></li>
        </ul>
      </nav>

      <a href="bookings.html" class="call-btn">Book Now</a>
    </header>

    <!-- Music Player -->
    <div class="music-player">
      <button id="musicBtn">▶</button>
      <audio id="bgMusic" loop>
        <source src="assets/glorix music.mp3" type="audio/mpeg" />
      </audio>
    </div>

    <!-- Bookings Section -->
    <main class="main-content">
      <!-- Hero Banner -->
      <div
        class="bookings-hero full-bleed"
        role="img"
        aria-label="Gradient banner"
      >
        <div class="bookings-hero__overlay">
          <h1 class="bookings-hero__title">BOOK YOUR TICKETS NOW!</h1>
        </div>
      </div>

      <!-- Offer Ticker -->
      <div class="offer-ticker full-bleed">
        <div class="offer-ticker__track" id="marqueeTrack">
          <!-- Marquee content will be loaded dynamically -->
        </div>
      </div>

      <!-- Events Section -->
      <section class="events-section">
        <h2 class="section-title"><span>UPCOMING</span> EVENTS</h2>
        <div class="events-container" id="upcomingEventsContainer">
          <!-- Upcoming cards will be loaded dynamically -->
        </div>

        <h2 class="section-title past-title"><span>PAST</span> EVENTS</h2>
        <div class="events-container" id="pastEventsContainer">
          <!-- Past cards will be loaded dynamically -->
        </div>
      </section>
    </main>

    <!-- Event Card Template -->
    <template id="eventCardTemplate">
      <div class="event-card">
        <div class="event-card__image">
          <img src="" alt="" loading="lazy" />
        </div>
        <div class="event-card__content">
          <h3 class="event-card__title"></h3>
          <p class="event-card__date"></p>
          <button class="event-card__btn"></button>
        </div>
      </div>
    </template>

    <!-- Event Card Template (Mobile) -->
    <template id="mobileEventCardTemplate">
      <div class="event-card-mobile">
        <div class="event-card-mobile__image">
          <img src="" alt="" loading="lazy" />
        </div>
        <div class="event-card-mobile__info">
          <div class="event-card-mobile__text">
            <h3 class="event-card-mobile__title"></h3>
            <p class="event-card-mobile__date"></p>
          </div>
          <button class="event-card-mobile__btn"></button>
        </div>
      </div>
    </template>

    <!-- Footer -->
    <footer>
      <div class="social-links">
        <a
          href="https://www.linkedin.com/company/glorix-events/"
          target="_blank"
          ><i class="fab fa-linkedin"></i
        ></a>
        <a href="https://www.instagram.com/_glorix._" target="_blank"
          ><i class="fab fa-instagram"></i
        ></a>
        <a href="https://www.facebook.com/share/1DJfPiCgjS/" target="_blank"
          ><i class="fab fa-facebook"></i
        ></a>
        <a href="https://www.youtube.com/@GLORIX_events" target="_blank"
          ><i class="fab fa-youtube"></i
        ></a>
      </div>
      <p class="copyright">Copyright © 2026 GLORIX - All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
    <script src="bookings.js"></script>
  </body>
</html>
